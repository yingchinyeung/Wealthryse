apiVersion: v3.0.2
kind: DataContract
id: wealthryse.gold.certified_figures
name: certified_figures
version: 1.0.0
status: active
domain: gold
dataProduct: portfolio-medallion
description:
  purpose: 'Certified figures (U5): one stored number per Metrics guide figure, subject and date, written by the
    certified-figures build, which checks its rows before it publishes them. Each row carries its definition and
    version, calculation version, input fingerprint, source row and lineage run.'
  usage: 'Read gold.v_certified_figures, not this table: it shows each figure from the newest published build. A
    build writes a row only for a new date or a value that changed, so older rows stay current until replaced.'
  limitations: Append-only (a trigger refuses UPDATE, DELETE and TRUNCATE). Rows go only into a build in shadow;
    rows of held or rolled-back builds stay but are never shown.
tags:
- gold
- derived
schema:
- name: certified_figures
  physicalName: gold.certified_figures
  physicalType: table
  logicalType: object
  dataGranularityDescription: One row per tenant_id, subject_id, figure_id, period, item, benchmark_id, as_of_date
    and build_id.
  description: 'Certified figures: one row per figure, subject, period, item, benchmark and date for each build
    that wrote it. Append-only; read through v_certified_figures.'
  properties:
  - name: tenant_id
    physicalType: uuid
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 1
    classification: internal
    description: Tenant that owns the row; row-level security filters on it.
  - name: build_id
    physicalType: uuid
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 8
    classification: internal
    description: The build that wrote the row (certified_builds).
  - name: subject_id
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 2
    classification: restricted
    description: 'Subject: an IBKR account number for accounts, a slug for portfolios and composites. Restricted.'
  - name: figure_id
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 3
    classification: internal
    description: The figure, from the register (infra/medallion/certified-figures.json), such as risk.sharpe_ratio.
  - name: period
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 4
    classification: confidential-financial
    description: ''''' unless the figure has periods: mtd, qtd, ytd, since_inception, year_YYYY or month_YYYY-MM.'
  - name: item
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 5
    classification: confidential-financial
    description: ''''' unless the figure has items: a holding''s conid, a sector, a currency, a scenario or portfolio/benchmark.
      Never a name.'
  - name: benchmark_id
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 6
    classification: internal
    description: ''''' unless the figure compares with a benchmark.'
  - name: as_of_date
    physicalType: date
    logicalType: date
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 7
    classification: confidential-financial
    description: The valuation date the figure is for.
  - name: value
    physicalType: double precision
    logicalType: number
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: The number, for units ratio (0.05 is 5%), number and money; NULL when unavailable or for date and
      text units.
  - name: value_text
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: The value for units date (yyyy-MM-dd) and text; NULL otherwise.
  - name: unit
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: ratio, number, money, date or text, as in the factsheet bindings.
  - name: currency
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: 'The currency of a money value: the subject''s reporting currency, or the holding''s or balance''s
      own.'
  - name: status
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: ok, or unavailable with the reason.
  - name: reason
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Why the figure is unavailable, in plain words.
  - name: detail
    physicalType: jsonb
    logicalType: object
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Facts that travel with the value, such as the day of the best day, counts or an FX rate.
  - name: period_start
    physicalType: date
    logicalType: date
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: First date of the data the figure uses, where it has one.
  - name: period_end
    physicalType: date
    logicalType: date
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Last date of the data the figure uses, where it has one.
  - name: observations
    physicalType: integer
    logicalType: integer
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: How many observations the figure uses, where it counts them.
  - name: definition_id
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: The Metrics guide entry's stable anchor, such as metric-sharpe-ratio.
  - name: definition_version
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: First 12 hex characters of a sha256 over the guide entry's wording.
  - name: calculation_version
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: The method versions of the code and the source row, such as risk-analytics-v2+benchmark-comparison-v1;
      imported+<contract> for IBKR's own values.
  - name: input_sha256
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: sha256 of the inputs the build used for this figure; same inputs and version must give the same
      value.
  - name: source_table
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: The gold or silver table the figure was read or worked out from.
  - name: source_key
    physicalType: jsonb
    logicalType: object
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: restricted
    description: The source row's key, where lineage.trace() starts; it can hold the account number.
  - name: lineage_run_id
    physicalType: uuid
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: The recorded job run that wrote this row (lineage_runs); NULL when that run was not recorded.
  - name: written_at
    physicalType: timestamp with time zone
    logicalType: date
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: When the row was written.
  quality:
  - name: published_drawdowns_at_most_zero
    description: A published drawdown is at most zero (the build checks before it publishes).
    type: sql
    query: SELECT COUNT(*) FROM gold.certified_figures f JOIN gold.certified_builds b ON b.tenant_id = f.tenant_id
      AND b.build_id = f.build_id WHERE b.published_at IS NOT NULL AND f.status = 'ok' AND f.figure_id IN ('risk.expected_max_drawdown_1y',
      'risk.actual_max_drawdown_1y', 'risk.tail_max_drawdown_1y', 'risk.crisis_max_drawdown_2008', 'risk.maximum_drawdown',
      'risk.crisis_scenario_max_drawdown', 'stats.maximum_drawdown', 'stats.current_drawdown', 'table.drawdown_episodes')
      AND f.value > 0
    mustBe: 0
    severity: error
    dimension: conformity
  - name: published_shares_between_zero_and_one
    description: A published win rate or share of months is between 0 and 1.
    type: sql
    query: SELECT COUNT(*) FROM gold.certified_figures f JOIN gold.certified_builds b ON b.tenant_id = f.tenant_id
      AND b.build_id = f.build_id WHERE b.published_at IS NOT NULL AND f.status = 'ok' AND f.figure_id IN ('risk.win_rate',
      'benchmark.relative_win_rate', 'stats.positive_months') AND (f.value < 0 OR f.value > 1)
    mustBe: 0
    severity: error
    dimension: conformity
  - name: published_correlations_between_minus_one_and_one
    description: A published correlation is between -1 and 1.
    type: sql
    query: SELECT COUNT(*) FROM gold.certified_figures f JOIN gold.certified_builds b ON b.tenant_id = f.tenant_id
      AND b.build_id = f.build_id WHERE b.published_at IS NOT NULL AND f.status = 'ok' AND f.figure_id IN ('benchmark.correlation',
      'series.rolling_correlation_126d', 'matrix.holdings_correlation') AND abs(f.value) > 1 + 1e-12
    mustBe: 0
    severity: error
    dimension: conformity
  - name: published_indicators_in_range
    description: A published RSI (14) is between 0 and 100 and a rolling volatility is not below zero.
    type: sql
    query: SELECT COUNT(*) FROM gold.certified_figures f JOIN gold.certified_builds b ON b.tenant_id = f.tenant_id
      AND b.build_id = f.build_id WHERE b.published_at IS NOT NULL AND f.status = 'ok' AND ((f.figure_id = 'indicator.rsi_14'
      AND (f.value < 0 OR f.value > 100)) OR (f.figure_id = 'series.rolling_volatility_63d' AND f.value < 0))
    mustBe: 0
    severity: error
    dimension: conformity
  - name: money_has_a_currency
    description: A money figure that is ok names its currency.
    type: sql
    query: SELECT COUNT(*) FROM gold.certified_figures WHERE unit = 'money' AND status = 'ok' AND currency IS NULL
    mustBe: 0
    severity: error
    dimension: conformity
  - name: rows_name_a_known_build
    description: Every row belongs to a build (a foreign key).
    type: sql
    query: SELECT COUNT(*) FROM gold.certified_figures f WHERE NOT EXISTS (SELECT 1 FROM gold.certified_builds b
      WHERE b.tenant_id = f.tenant_id AND b.build_id = f.build_id)
    mustBe: 0
    severity: error
    dimension: consistency
team:
- username: portfolio-platform
  role: owner
customProperties:
- property: source
  value: derived
- property: catalogNote
  value: 'Certified figures (U5): one stored, checked number per Metrics guide figure, subject and date. Append-only.'
- property: readByViews
  value:
  - gold.v_certified_figures
- property: calculationVersionColumn
  value: calculation_version
- property: calculationVersionSource
  value:
  - ibkr_etl.certified_figures.calculation_version
- property: register
  value: infra/medallion/certified-figures.json
contractCreatedTs: '2026-10-18T00:00:00Z'
