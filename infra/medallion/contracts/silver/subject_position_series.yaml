apiVersion: v3.0.2
kind: DataContract
id: wealthryse.silver.subject_position_series
name: subject_position_series
version: 1.0.0
status: active
domain: silver
dataProduct: portfolio-medallion
description:
  purpose: 'Daily positions for every subject: IBKR accounts (position_snapshots) and derived portfolios (derived_portfolio_positions).
    The positions read contract.'
  limitations: 'A security_invoker view: each reader sees only its own tenant''s rows through the tables'' row-level
    security.'
tags:
- silver
- derived
schema:
- name: subject_position_series
  physicalName: silver.subject_position_series
  physicalType: view
  logicalType: object
  dataGranularityDescription: One row per tenant_id, subject_id, snapshot_date, conid and model_code.
  properties:
  - name: tenant_id
    physicalType: uuid
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: 'Tenant: from silver.accounts for an account, from the row for a derived portfolio.'
  - name: subject_id
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: restricted
    description: 'Subject: an IBKR account number for accounts, a slug for portfolios and composites. Restricted.'
  - name: source_kind
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: physical_account for an IBKR account, derived_portfolio for a derived portfolio.
    quality:
    - name: source_kind_allowed_values
      description: source_kind is one of physical_account, derived_portfolio (the view definition).
      type: sql
      query: SELECT COUNT(*) FROM silver.subject_position_series WHERE source_kind NOT IN ('physical_account', 'derived_portfolio')
      mustBe: 0
      severity: error
      dimension: conformity
  - name: snapshot_date
    physicalType: text
    logicalType: date
    logicalTypeOptions:
      format: yyyy-MM-dd
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Statement date of the position.
    quality:
    - name: snapshot_date_is_iso_date
      description: snapshot_date is an ISO date (yyyy-MM-dd) when present.
      type: sql
      query: SELECT COUNT(*) FROM silver.subject_position_series WHERE snapshot_date IS NOT NULL AND snapshot_date
        !~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      mustBe: 0
      severity: error
      dimension: conformity
  - name: conid
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: IBKR contract id.
  - name: model_code
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: IBKR model code; empty when none.
  - name: currency
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Currency of the position's values.
  - name: quantity_text
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Quantity as decimal text.
  - name: cost_basis_text
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Cost basis as decimal text.
  - name: mark_price_text
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Mark price as decimal text.
  - name: market_value_text
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Market value in currency as decimal text.
  - name: unrealized_pnl_text
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Unrealised P&L as decimal text.
  quality:
  - name: grain_is_unique
    description: No two rows share (tenant_id, subject_id, snapshot_date, conid, model_code).
    type: sql
    query: SELECT COUNT(*) FROM (SELECT tenant_id, subject_id, snapshot_date, conid, model_code FROM silver.subject_position_series
      GROUP BY tenant_id, subject_id, snapshot_date, conid, model_code HAVING COUNT(*) > 1) d
    mustBe: 0
    severity: warning
    dimension: uniqueness
team:
- username: portfolio-platform
  role: owner
customProperties:
- property: source
  value: derived
- property: catalogNote
  value: 'Read contract: positions for accounts and derived subjects.'
- property: consumers
  value:
  - ibkr_etl.agent_tools
  - ibkr_etl.export_agent_source
  - ibkr_etl.historical_reporting
  - ibkr_etl.risk_snapshots
  - ibkr_etl.subject_exports
  - ibkr_etl.web
  - ibkr_etl.web_modelling
contractCreatedTs: '2026-10-18T00:00:00Z'
