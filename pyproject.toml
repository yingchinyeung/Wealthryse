[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibkr-portfolio-etl"
version = "1.1.0"
description = "Idempotent IBKR Flex statement ingestion and portfolio analytics database"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.19,<2",
    "azure-storage-blob>=12.24,<13",
    "fastapi>=0.115,<1",
    "openai>=2,<3",
    "python-multipart>=0.0.20,<1",
    "pypdf>=5,<7",
    "psycopg[binary]>=3.2,<4",
    "pyjwt[crypto]>=2.15.1,<3",
    "reportlab>=4,<5",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.34,<1",
    "yfinance>=0.2.54,<1",
]

[project.scripts]
ibkr-etl = "ibkr_etl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ibkr_etl = ["assets/alpha_world_subtitle_font.pdf", "assets/alpha_world_ms_disclaimer_font.pdf", "assets/alpha_world_ms_crisis_market_v1.json", "metrics_guide_sources.json", "certified_figures_register.json", "factsheet_spec/designs/*.json", "factsheet_spec/templates/*.pdf", "publish_gate_rules.json"]
