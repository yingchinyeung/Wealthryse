apiVersion: v3.0.2
kind: DataContract
id: wealthryse.silver.subject_live_executions
name: subject_live_executions
version: 1.0.0
status: active
domain: silver
dataProduct: portfolio-medallion
description:
  purpose: Live fills per physical account (subject), from the live collector's executions, for the Desk page (wiring
    design section 1).
  usage: Filter executed_at to the day wanted (the Desk page reads today's). Flex statements stay the book of record;
    these are the live view only.
  limitations: Kept for the live tables' retention period only. Created by a held migration (infra/medallion/drafts/desk_live_views.sql,
    077 on its day).
tags:
- silver
- derived
