apiVersion: v3.0.2
kind: DataContract
id: wealthryse.silver.v_latest_positions
name: v_latest_positions
version: 1.0.0
status: active
domain: silver
dataProduct: portfolio-medallion
description:
  purpose: Each account's positions on its latest statement date in position_snapshots.
  limitations: 'A security_invoker view: each reader sees only its own tenant''s rows through the tables'' row-level
    security. Has no tenant_id column.'
tags:
- silver
- derived
schema:
- name: v_latest_positions
  physicalName: silver.v_latest_positions
  physicalType: view
  logicalType: object
  dataGranularityDescription: One row per account_id, conid and model_code.
  properties:
  - name: account_id
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: restricted
    description: 'IBKR account number. Restricted: never shown or logged in full.'
  - name: snapshot_date
    physicalType: text
    logicalType: date
    logicalTypeOptions:
      format: yyyy-MM-dd
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: The account's latest statement date.
    quality:
    - name: snapshot_date_is_iso_date
      description: snapshot_date is an ISO date (yyyy-MM-dd) when present.
      type: sql
      query: SELECT COUNT(*) FROM silver.v_latest_positions WHERE snapshot_date IS NOT NULL AND snapshot_date !~
        '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      mustBe: 0
      severity: error
      dimension: conformity
  - name: conid
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: IBKR contract id.
  - name: model_code
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: IBKR model code; empty when none.
  - name: currency
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Currency of the position's values.
  - name: quantity_text
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Quantity as decimal text.
  - name: cost_basis_text
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Cost basis as decimal text.
  - name: mark_price_text
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Mark price as decimal text.
  - name: market_value_text
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Market value as decimal text.
  - name: unrealized_pnl_text
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Unrealised P&L as decimal text.
  - name: row_sha256
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: sha256 of the source Flex row; the same digest as the row in bronze.flex_rows.
  - name: last_seen_run_id
    physicalType: bigint
    logicalType: integer
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: Ingestion run that last wrote the row (ingestion_runs.run_id).
  quality:
  - name: grain_is_unique
    description: No two rows share (account_id, conid, model_code).
    type: sql
    query: SELECT COUNT(*) FROM (SELECT account_id, conid, model_code FROM silver.v_latest_positions GROUP BY account_id,
      conid, model_code HAVING COUNT(*) > 1) d
    mustBe: 0
    severity: warning
    dimension: uniqueness
team:
- username: portfolio-platform
  role: owner
customProperties:
- property: source
  value: derived
- property: catalogNote
  value: Latest position_snapshots.
- property: consumers
  value:
  - ibkr_etl.analyst_export
  - ibkr_etl.reference_data
  - ibkr_etl.report
contractCreatedTs: '2026-10-18T00:00:00Z'
