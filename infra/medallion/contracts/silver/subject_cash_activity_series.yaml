apiVersion: v3.0.2
kind: DataContract
id: wealthryse.silver.subject_cash_activity_series
name: subject_cash_activity_series
version: 1.0.0
status: active
domain: silver
dataProduct: portfolio-medallion
description:
  purpose: 'Cash activity for every subject: IBKR accounts (cash_transactions) and derived portfolios (their cash
    ledger). The cash activity read contract.'
  limitations: 'A security_invoker view: each reader sees only its own tenant''s rows through the tables'' row-level
    security. For accounts, included is always true and external_flow always false: the view does not classify account
    flows. Derived portfolios carry their ledger''s flags.'
tags:
- silver
- derived
schema:
- name: subject_cash_activity_series
  physicalName: silver.subject_cash_activity_series
  physicalType: view
  logicalType: object
  dataGranularityDescription: One row per tenant_id, subject_id, source_kind and source_key.
  properties:
  - name: tenant_id
    physicalType: uuid
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: 'Tenant: from silver.accounts for an account, from the row for a derived portfolio.'
  - name: subject_id
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: restricted
    description: 'Subject: an IBKR account number for accounts, a slug for portfolios and composites. Restricted.'
  - name: source_kind
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: physical_account for an IBKR account, derived_portfolio for a derived portfolio.
    quality:
    - name: source_kind_allowed_values
      description: source_kind is one of physical_account, derived_portfolio (the view definition).
      type: sql
      query: SELECT COUNT(*) FROM silver.subject_cash_activity_series WHERE source_kind NOT IN ('physical_account',
        'derived_portfolio')
      mustBe: 0
      severity: error
      dimension: conformity
  - name: source_key
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: Source row key for an account; the ledger's event_key for a derived portfolio.
  - name: effective_date
    physicalType: text
    logicalType: date
    logicalTypeOptions:
      format: yyyy-MM-dd
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Date the activity counts from.
    quality:
    - name: effective_date_is_iso_date
      description: effective_date is an ISO date (yyyy-MM-dd) when present.
      type: sql
      query: SELECT COUNT(*) FROM silver.subject_cash_activity_series WHERE effective_date IS NOT NULL AND effective_date
        !~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      mustBe: 0
      severity: error
      dimension: conformity
  - name: event_datetime
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: IBKR dateTime for an account; the event date for a derived portfolio.
  - name: transaction_type
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: IBKR transaction type, or the ledger classification.
  - name: description
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Description of the activity.
  - name: amount_text
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Amount in currency as text.
  - name: currency
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Currency of the amount.
  - name: conid
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Related contract, when there is one.
  - name: included
    physicalType: boolean
    logicalType: boolean
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Whether the activity counts toward the subject's cash; always true for accounts.
  - name: external_flow
    physicalType: boolean
    logicalType: boolean
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Whether the activity is money in or out of the subject; always false for accounts.
  quality:
  - name: grain_is_unique
    description: No two rows share (tenant_id, subject_id, source_kind, source_key).
    type: sql
    query: SELECT COUNT(*) FROM (SELECT tenant_id, subject_id, source_kind, source_key FROM silver.subject_cash_activity_series
      GROUP BY tenant_id, subject_id, source_kind, source_key HAVING COUNT(*) > 1) d
    mustBe: 0
    severity: warning
    dimension: uniqueness
team:
- username: portfolio-platform
  role: owner
customProperties:
- property: source
  value: derived
- property: catalogNote
  value: 'Read contract: cash activity.'
- property: consumers
  value:
  - ibkr_etl.export_agent_source
  - ibkr_etl.subject_exports
  - ibkr_etl.web
contractCreatedTs: '2026-10-18T00:00:00Z'
