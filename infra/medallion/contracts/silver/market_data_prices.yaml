apiVersion: v3.0.2
kind: DataContract
id: wealthryse.silver.market_data_prices
name: market_data_prices
version: 1.0.0
status: active
domain: silver
dataProduct: portfolio-medallion
description:
  purpose: 'Daily closes from Yahoo Finance for instruments needed outside the IBKR statements: the Hang Seng index
    and SPY for the composites, and the stand-in ETFs of the crisis replay.'
tags:
- silver
- market-data
schema:
- name: market_data_prices
  physicalName: silver.market_data_prices
  physicalType: table
  logicalType: object
  dataGranularityDescription: One row per tenant_id, instrument_id, price_date and price_type.
  properties:
  - name: tenant_id
    physicalType: uuid
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 1
    classification: internal
    description: Tenant that owns the row; row-level security filters on it.
  - name: instrument_id
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 2
    classification: internal
    description: Platform id of the instrument, such as hang-seng-price-index, spy-settlement or crisis-replay-<ticker>.
  - name: price_date
    physicalType: text
    logicalType: date
    logicalTypeOptions:
      format: yyyy-MM-dd
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 3
    classification: internal
    description: Trading date in the exchange's own time zone.
    quality:
    - name: price_date_is_iso_date
      description: price_date is an ISO date (yyyy-MM-dd) when present.
      type: sql
      query: SELECT COUNT(*) FROM silver.market_data_prices WHERE price_date IS NOT NULL AND price_date !~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      mustBe: 0
      severity: error
      dimension: conformity
  - name: symbol
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: Provider ticker.
  - name: instrument_name
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: Instrument name.
  - name: price_type
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 4
    classification: internal
    description: price_index_close, unadjusted_close or adjusted_close.
  - name: currency
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: Currency of the price.
  - name: price
    physicalType: double precision
    logicalType: number
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: Close in currency; above zero.
    quality:
    - name: price_positive
      description: price is above zero; the writers drop non-positive closes.
      type: sql
      query: SELECT COUNT(*) FROM silver.market_data_prices WHERE price <= 0
      mustBe: 0
      severity: error
      dimension: conformity
  - name: source
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: Data provider.
  - name: source_url
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: The provider call that produced the price.
  - name: fetched_at
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: UTC time (ISO 8601) the row was last written.
slaDefaultElement: market_data_prices.price_date
slaProperties:
- property: frequency
  value: 1
  unit: d
  element: market_data_prices.price_date
- property: timeOfAvailability
  value: 09:30+00:00
  element: market_data_prices.price_date
  driver: operational
- property: latency
  value: 4
  unit: d
  element: market_data_prices.price_date
  driver: operational
team:
- username: portfolio-platform
  role: owner
customProperties:
- property: source
  value: market-data
- property: catalogNote
  value: Parsed Yahoo prices. The raw responses will be kept in the bronze-market-data container.
- property: consumers
  value:
  - ibkr_etl.alpha_world_t_crisis
  - ibkr_etl.analyst_export
  - ibkr_etl.derived_portfolio
  - ibkr_etl.layer_freshness
  - ibkr_etl.onboarding_v2_web
  - ibkr_etl.web
- property: producers
  value:
  - ibkr_etl.crisis_replay
  - ibkr_etl.market_data
- property: freshnessCheck
  value:
    checkId: silver.market_data_prices
    measure: as_of_date
    required: true
    query: SELECT MAX(price_date) AS observed FROM market_data_prices
    source: ibkr_etl.layer_freshness.RULES
contractCreatedTs: '2026-10-18T00:00:00Z'
