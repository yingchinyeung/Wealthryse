apiVersion: v3.0.2
kind: DataContract
id: wealthryse.silver.subject_cash_balance_series
name: subject_cash_balance_series
version: 1.0.0
status: active
domain: silver
dataProduct: portfolio-medallion
description:
  purpose: 'Daily cash balances for every subject: IBKR accounts (cash_snapshots) and derived portfolios (derived_portfolio_cash_balances).
    The cash balance read contract.'
  limitations: 'A security_invoker view: each reader sees only its own tenant''s rows through the tables'' row-level
    security. A derived portfolio''s ending and settled cash are both its closing balance.'
tags:
- silver
- derived
schema:
- name: subject_cash_balance_series
  physicalName: silver.subject_cash_balance_series
  physicalType: view
  logicalType: object
  dataGranularityDescription: One row per tenant_id, subject_id, snapshot_date and currency.
  properties:
  - name: tenant_id
    physicalType: uuid
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: 'Tenant: from silver.accounts for an account, from the row for a derived portfolio.'
  - name: subject_id
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: restricted
    description: 'Subject: an IBKR account number for accounts, a slug for portfolios and composites. Restricted.'
  - name: source_kind
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: physical_account for an IBKR account, derived_portfolio for a derived portfolio.
    quality:
    - name: source_kind_allowed_values
      description: source_kind is one of physical_account, derived_portfolio (the view definition).
      type: sql
      query: SELECT COUNT(*) FROM silver.subject_cash_balance_series WHERE source_kind NOT IN ('physical_account',
        'derived_portfolio')
      mustBe: 0
      severity: error
      dimension: conformity
  - name: snapshot_date
    physicalType: text
    logicalType: date
    logicalTypeOptions:
      format: yyyy-MM-dd
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Balance date.
    quality:
    - name: snapshot_date_is_iso_date
      description: snapshot_date is an ISO date (yyyy-MM-dd) when present.
      type: sql
      query: SELECT COUNT(*) FROM silver.subject_cash_balance_series WHERE snapshot_date IS NOT NULL AND snapshot_date
        !~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      mustBe: 0
      severity: error
      dimension: conformity
  - name: currency
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Currency of the balance.
  - name: ending_cash_text
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Ending cash as text.
  - name: settled_cash_text
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Settled cash as text.
  - name: fx_rate_to_base_text
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Rate to the subject's base currency as text.
  quality:
  - name: grain_is_unique
    description: No two rows share (tenant_id, subject_id, snapshot_date, currency).
    type: sql
    query: SELECT COUNT(*) FROM (SELECT tenant_id, subject_id, snapshot_date, currency FROM silver.subject_cash_balance_series
      GROUP BY tenant_id, subject_id, snapshot_date, currency HAVING COUNT(*) > 1) d
    mustBe: 0
    severity: warning
    dimension: uniqueness
team:
- username: portfolio-platform
  role: owner
customProperties:
- property: source
  value: derived
- property: catalogNote
  value: 'Read contract: cash balances.'
- property: consumers
  value:
  - ibkr_etl.agent_tools
  - ibkr_etl.export_agent_source
  - ibkr_etl.web
contractCreatedTs: '2026-10-18T00:00:00Z'
