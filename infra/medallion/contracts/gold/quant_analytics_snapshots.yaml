apiVersion: v3.0.2
kind: DataContract
id: wealthryse.gold.quant_analytics_snapshots
name: quant_analytics_snapshots
version: 1.0.0
status: active
domain: gold
dataProduct: portfolio-medallion
description:
  purpose: The quant analytics sections of a subject on a date, one JSON payload per section, with fingerprints
    of its inputs and of the payload (wiring design section 1). The website's Performance, Risk and Modelling cards
    read it once their pages are switched on.
  usage: Read the analytics_version the reader expects, the latest as_of_date on or before the date asked for, and
    skip rows whose quality_status is fail. payload_json.results holds each engine's own output under the name of
    the call; an unavailable section says why in payload_json.reason.
  limitations: v1 covers physical accounts and derived subjects; Alpha World MS and T and profiled composites are
    stored as unavailable. Liquidity, macro exposures, factor attribution, 13F crowding, fair value and spread paid
    are not in v1 (their data is not in silver yet). Created by a held migration (infra/medallion/drafts/quant_analytics.sql,
    076 on its day).
tags:
- gold
- derived
schema:
- name: quant_analytics_snapshots
  physicalName: gold.quant_analytics_snapshots
  physicalType: table
  logicalType: object
  description: Quant analytics payload per subject, date and section (wiring design section 1). Written by the quant-analytics
    job; a row whose quality_status is fail is never shown.
  dataGranularityDescription: One row per tenant_id, subject_id, as_of_date, section and analytics_version.
  properties:
  - name: tenant_id
    physicalType: uuid
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 1
    classification: internal
    description: Tenant that owns the row; row-level security filters on it.
  - name: subject_id
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 2
    classification: restricted
    description: 'Subject: an IBKR account number for accounts, a slug for portfolios and composites. Restricted.'
  - name: as_of_date
    physicalType: text
    logicalType: date
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 3
    classification: confidential-financial
    logicalTypeOptions:
      format: yyyy-MM-dd
    description: The NAV date the section is as of.
    quality:
    - name: as_of_date_is_iso_date
      description: as_of_date is an ISO date (yyyy-MM-dd) (a CHECK constraint).
      type: sql
      query: SELECT COUNT(*) FROM gold.quant_analytics_snapshots WHERE as_of_date !~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      mustBe: 0
      severity: error
      dimension: conformity
  - name: section
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 4
    classification: internal
    description: One of skill, decisions, currency, tail, regime, holdings_risk, correlation, concentration, execution;
      part of the key.
    quality:
    - name: section_allowed_values
      description: section is one of the nine v1 sections (a CHECK constraint).
      type: sql
      query: SELECT COUNT(*) FROM gold.quant_analytics_snapshots WHERE section NOT IN ('skill', 'decisions', 'currency',
        'tail', 'regime', 'holdings_risk', 'correlation', 'concentration', 'execution')
      mustBe: 0
      severity: error
      dimension: conformity
  - name: analytics_version
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 5
    classification: internal
    description: Quant analytics version (quant_snapshots.QUANT_ANALYTICS_VERSION); part of the key.
  - name: model_id
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: The model card the section's engine is documented in (ibkr_etl.model_cards).
  - name: model_version
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: The engine's MODEL_VERSION when the section was built.
  - name: source_data_sha256
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: sha256 fingerprint of the section's canonical inputs and versions; an unchanged fingerprint is
      not rebuilt.
    quality:
    - name: source_data_sha256_is_sha256
      description: source_data_sha256 is a lowercase hex sha256 (a CHECK constraint).
      type: sql
      query: SELECT COUNT(*) FROM gold.quant_analytics_snapshots WHERE source_data_sha256 !~ '^[0-9a-f]{64}$'
      mustBe: 0
      severity: error
      dimension: conformity
  - name: payload_sha256
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: sha256 of the payload's canonical JSON as written.
    quality:
    - name: payload_sha256_is_sha256
      description: payload_sha256 is a lowercase hex sha256 (a CHECK constraint).
      type: sql
      query: SELECT COUNT(*) FROM gold.quant_analytics_snapshots WHERE payload_sha256 !~ '^[0-9a-f]{64}$'
      mustBe: 0
      severity: error
      dimension: conformity
  - name: payload_json
    physicalType: jsonb
    logicalType: object
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: 'The section payload: section, model_id, model_version, as_of, available, reason, inputs and results.'
  - name: quality_status
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: pass (every call worked), warn (the section or a call is unavailable, or a number that was not
      finite was stored as null) or fail (never shown).
    quality:
    - name: quality_status_allowed_values
      description: quality_status is one of pass, warn, fail (a CHECK constraint).
      type: sql
      query: SELECT COUNT(*) FROM gold.quant_analytics_snapshots WHERE quality_status NOT IN ('pass', 'warn', 'fail')
      mustBe: 0
      severity: error
      dimension: conformity
  - name: generated_at
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: UTC time (ISO 8601) the row was written.
  - name: duration_ms
    physicalType: double precision
    logicalType: number
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: Time to build the section, in milliseconds.
    quality:
    - name: duration_not_negative
      description: duration_ms is zero or more (a CHECK constraint).
      type: sql
      query: SELECT COUNT(*) FROM gold.quant_analytics_snapshots WHERE duration_ms < 0
      mustBe: 0
      severity: error
      dimension: conformity
  - name: timings_json
    physicalType: jsonb
    logicalType: object
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: Build, load and prepare times, and how many non-finite numbers were stored as null.
  - name: lineage_run_id
    physicalType: uuid
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: The recorded job run that last inserted or updated this row (lineage_runs); NULL when that run
      was not recorded.
  quality:
  - name: payload_names_its_row
    description: The payload names the same section, model and date as its row.
    type: sql
    query: SELECT COUNT(*) FROM gold.quant_analytics_snapshots WHERE (payload_json->>'section' = section AND payload_json->>'model_id'
      = model_id AND payload_json->>'model_version' = model_version AND payload_json->>'as_of' = as_of_date) IS
      NOT TRUE
    mustBe: 0
    severity: error
    dimension: consistency
  - name: payload_says_if_available
    description: Every payload says whether the section is available.
    type: sql
    query: SELECT COUNT(*) FROM gold.quant_analytics_snapshots WHERE COALESCE(jsonb_typeof(payload_json->'available'),
      '') <> 'boolean'
    mustBe: 0
    severity: error
    dimension: completeness
  - name: unavailable_sections_say_why
    description: An unavailable section gives its reason.
    type: sql
    query: SELECT COUNT(*) FROM gold.quant_analytics_snapshots WHERE payload_json->>'available' = 'false' AND COALESCE(payload_json->>'reason',
      '') = ''
    mustBe: 0
    severity: warning
    dimension: completeness
slaDefaultElement: quant_analytics_snapshots.as_of_date
slaProperties:
- property: frequency
  value: 1
  unit: d
  element: quant_analytics_snapshots.as_of_date
- property: timeOfAvailability
  value: 10:00+00:00
  element: quant_analytics_snapshots.as_of_date
  driver: operational
- property: latency
  value: 4
  unit: d
  element: quant_analytics_snapshots.as_of_date
  driver: operational
team:
- username: portfolio-platform
  role: owner
customProperties:
- property: source
  value: derived
- property: catalogNote
  value: Quant analytics payload per subject, date and section (docs/QUANT_ANALYTICS.md). Written by ibkrv2stg-quant-analytics,
    which does nothing unless QUANT_ANALYTICS_BUILD=on.
- property: consumers
  value:
  - ibkr_etl.layer_freshness
  - ibkr_etl.quant_snapshots
- property: producers
  value:
  - ibkr_etl.quant_snapshots
- property: freshnessCheck
  value:
    checkId: gold.quant_analytics_snapshots
    measure: as_of_date
    required: false
    query: SELECT MAX(as_of_date) AS observed FROM quant_analytics_snapshots
    source: ibkr_etl.layer_freshness.RULES
- property: calculationVersionColumn
  value: analytics_version
- property: calculationVersionSource
  value:
  - ibkr_etl.quant_snapshots.QUANT_ANALYTICS_VERSION
contractCreatedTs: '2026-10-18T00:00:00Z'
