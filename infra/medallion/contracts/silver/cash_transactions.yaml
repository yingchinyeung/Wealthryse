apiVersion: v3.0.2
kind: DataContract
id: wealthryse.silver.cash_transactions
name: cash_transactions
version: 1.0.1
status: active
domain: silver
dataProduct: portfolio-medallion
description:
  purpose: 'Cash transactions per account from the Flex statements: deposits and withdrawals, dividends, interest,
    fees and the rest of IBKR''s cash activity.'
  limitations: Amounts are decimal text, cast on read. Isolated by account (the account_isolation policy looks the
    account up in silver.accounts), not by a tenant_id column. Keeps only the latest version of each row. Once review
    item U8's history is switched on, every version is also kept in silver.cash_transactions_history, and silver.cash_transactions_as_known(at)
    returns this table as it stood at any moment. Flows are classified downstream (derived_portfolio, the benchmark
    comparison), not here.
tags:
- silver
- ibkr
schema:
- name: cash_transactions
  physicalName: silver.cash_transactions
  physicalType: table
  logicalType: object
  dataGranularityDescription: One row per account_id and source_key.
  properties:
  - name: account_id
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 1
    classification: restricted
    description: 'IBKR account number. Restricted: never shown or logged in full.'
  - name: source_key
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 2
    classification: internal
    description: Stable key of the statement row (parser._source_key).
  - name: transaction_id
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: IBKR transactionID.
  - name: event_datetime
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: dateTime as IBKR sends it (not normalised).
  - name: model_code
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: IBKR model code.
  - name: effective_date
    physicalType: text
    logicalType: date
    logicalTypeOptions:
      format: yyyy-MM-dd
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Report date of the statement row.
    quality:
    - name: effective_date_is_iso_date
      description: effective_date is an ISO date (yyyy-MM-dd) when present.
      type: sql
      query: SELECT COUNT(*) FROM silver.cash_transactions WHERE effective_date IS NOT NULL AND effective_date !~
        '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      mustBe: 0
      severity: error
      dimension: conformity
  - name: settle_date
    physicalType: text
    logicalType: date
    logicalTypeOptions:
      format: yyyy-MM-dd
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Settle date.
    quality:
    - name: settle_date_is_iso_date
      description: settle_date is an ISO date (yyyy-MM-dd) when present.
      type: sql
      query: SELECT COUNT(*) FROM silver.cash_transactions WHERE settle_date IS NOT NULL AND settle_date !~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      mustBe: 0
      severity: error
      dimension: conformity
  - name: transaction_type
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: IBKR cash transaction type, such as Deposits/Withdrawals or Dividends.
  - name: description
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: IBKR description of the transaction.
  - name: amount_text
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Amount in currency as decimal text; negative for money out.
    quality:
    - name: amount_text_is_decimal
      description: amount_text is plain decimal text when present. The loader writes decimal text (util.decimal_text);
        readers cast it.
      type: sql
      query: SELECT COUNT(*) FROM silver.cash_transactions WHERE amount_text IS NOT NULL AND amount_text !~ '^-?[0-9]+(\.[0-9]+)?$'
      mustBe: 0
      severity: error
      dimension: conformity
  - name: currency
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Currency of the amount.
  - name: conid
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Related contract, when there is one.
  - name: row_sha256
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: sha256 of the source Flex row; the same digest as the row in bronze.flex_rows.
    quality:
    - name: row_sha256_is_sha256
      description: row_sha256 is a lowercase hex sha256 (util.sha256_text of the row).
      type: sql
      query: SELECT COUNT(*) FROM silver.cash_transactions WHERE row_sha256 IS NOT NULL AND row_sha256 !~ '^[0-9a-f]{64}$'
      mustBe: 0
      severity: error
      dimension: conformity
  - name: last_seen_run_id
    physicalType: bigint
    logicalType: integer
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: Ingestion run that last wrote the row (ingestion_runs.run_id).
  quality:
  - name: account_in_accounts
    description: Every row's account is in silver.accounts. A row of an unknown account is invisible to every tenant
      under the account_isolation policy, so run this with a role that bypasses row-level security.
    type: sql
    query: SELECT COUNT(*) FROM silver.cash_transactions t WHERE NOT EXISTS (SELECT 1 FROM silver.accounts a WHERE
      a.account_id = t.account_id)
    mustBe: 0
    severity: warning
    dimension: consistency
team:
- username: portfolio-platform
  role: owner
customProperties:
- property: source
  value: ibkr
- property: catalogNote
  value: Typed Flex sections; values are still stored as text and cast on read.
- property: readByViews
  value:
  - silver.subject_cash_activity_series
- property: consumers
  value:
  - ibkr_etl.analyst_export
  - ibkr_etl.derived_portfolio
  - ibkr_etl.onboarding
  - ibkr_etl.reference_data_source
  - ibkr_etl.report
- property: producers
  value:
  - ibkr_etl.loader
contractCreatedTs: '2026-10-18T00:00:00Z'
