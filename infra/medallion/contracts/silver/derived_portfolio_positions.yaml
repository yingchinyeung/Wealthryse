apiVersion: v3.0.2
kind: DataContract
id: wealthryse.silver.derived_portfolio_positions
name: derived_portfolio_positions
version: 1.0.0
status: active
domain: silver
dataProduct: portfolio-medallion
description:
  purpose: 'Positions of each derived portfolio: the source account''s positions that pass the portfolio''s filter
    (for example, everything except Taiwan listings).'
  limitations: Rebuilt in full for a portfolio on each refresh. Values are decimal text copied from silver.position_snapshots.
tags:
- silver
- derived
schema:
- name: derived_portfolio_positions
  physicalName: silver.derived_portfolio_positions
  physicalType: table
  logicalType: object
  dataGranularityDescription: One row per tenant_id, portfolio_id, snapshot_date, conid and model_code.
  properties:
  - name: tenant_id
    physicalType: uuid
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 1
    classification: internal
    description: Tenant that owns the row; row-level security filters on it.
  - name: portfolio_id
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 2
    classification: confidential-financial
    description: Derived portfolio id (derived_portfolios.portfolio_id).
  - name: source_account_id
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: restricted
    description: IBKR account the portfolio is filtered from. Restricted.
  - name: snapshot_date
    physicalType: text
    logicalType: date
    logicalTypeOptions:
      format: yyyy-MM-dd
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 3
    classification: confidential-financial
    description: Statement date of the source position.
    quality:
    - name: snapshot_date_is_iso_date
      description: snapshot_date is an ISO date (yyyy-MM-dd) when present.
      type: sql
      query: SELECT COUNT(*) FROM silver.derived_portfolio_positions WHERE snapshot_date IS NOT NULL AND snapshot_date
        !~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      mustBe: 0
      severity: error
      dimension: conformity
  - name: conid
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 4
    classification: confidential-financial
    description: IBKR contract id.
  - name: model_code
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 5
    classification: confidential-financial
    description: IBKR model code; empty when none.
  - name: currency
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Currency of the position's values.
  - name: quantity_text
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Quantity as decimal text.
    quality:
    - name: quantity_text_is_decimal
      description: quantity_text is plain decimal text when present. Copied from position_snapshots.
      type: sql
      query: SELECT COUNT(*) FROM silver.derived_portfolio_positions WHERE quantity_text IS NOT NULL AND quantity_text
        !~ '^-?[0-9]+(\.[0-9]+)?$'
      mustBe: 0
      severity: error
      dimension: conformity
  - name: cost_basis_text
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Cost basis as decimal text.
    quality:
    - name: cost_basis_text_is_decimal
      description: cost_basis_text is plain decimal text when present. Copied from position_snapshots.
      type: sql
      query: SELECT COUNT(*) FROM silver.derived_portfolio_positions WHERE cost_basis_text IS NOT NULL AND cost_basis_text
        !~ '^-?[0-9]+(\.[0-9]+)?$'
      mustBe: 0
      severity: error
      dimension: conformity
  - name: mark_price_text
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Mark price as decimal text.
    quality:
    - name: mark_price_text_is_decimal
      description: mark_price_text is plain decimal text when present. Copied from position_snapshots.
      type: sql
      query: SELECT COUNT(*) FROM silver.derived_portfolio_positions WHERE mark_price_text IS NOT NULL AND mark_price_text
        !~ '^-?[0-9]+(\.[0-9]+)?$'
      mustBe: 0
      severity: error
      dimension: conformity
  - name: market_value_text
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Market value in currency as decimal text.
    quality:
    - name: market_value_text_is_decimal
      description: market_value_text is plain decimal text when present. Copied from position_snapshots.
      type: sql
      query: SELECT COUNT(*) FROM silver.derived_portfolio_positions WHERE market_value_text IS NOT NULL AND market_value_text
        !~ '^-?[0-9]+(\.[0-9]+)?$'
      mustBe: 0
      severity: error
      dimension: conformity
  - name: unrealized_pnl_text
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Unrealised P&L as decimal text.
    quality:
    - name: unrealized_pnl_text_is_decimal
      description: unrealized_pnl_text is plain decimal text when present. Copied from position_snapshots.
      type: sql
      query: SELECT COUNT(*) FROM silver.derived_portfolio_positions WHERE unrealized_pnl_text IS NOT NULL AND unrealized_pnl_text
        !~ '^-?[0-9]+(\.[0-9]+)?$'
      mustBe: 0
      severity: error
      dimension: conformity
  - name: generated_at
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: UTC time (ISO 8601) of the run that wrote the row.
  quality:
  - name: not_also_excluded
    description: A source position is either included or excluded, never both.
    type: sql
    query: SELECT COUNT(*) FROM silver.derived_portfolio_positions p JOIN silver.derived_portfolio_exclusions e
      USING (tenant_id, portfolio_id, snapshot_date, conid, model_code)
    mustBe: 0
    severity: error
    dimension: consistency
team:
- username: portfolio-platform
  role: owner
customProperties:
- property: source
  value: derived
- property: catalogNote
  value: Filtered and composite subjects, conformed to the same shape as account data.
- property: readByViews
  value:
  - silver.subject_position_series
- property: consumers
  value:
  - ibkr_etl.analyst_export
  - ibkr_etl.designed_reports
  - ibkr_etl.onboarding_dry_run
  - ibkr_etl.onboarding_reports
  - ibkr_etl.report
  - ibkr_etl.web
- property: producers
  value:
  - ibkr_etl.derived_portfolio
contractCreatedTs: '2026-10-18T00:00:00Z'
