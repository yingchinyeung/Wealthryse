#cloud-config
# ibkrv2stg-ibkr-gateway: IB Gateway and the WealthRyse live collector.
#
# infra/staging-ibkr-gateway.bicep loads this file, replaces each placeholder
# below with a non-secret value (names, IDs, image digests, ports, or a base64
# copy of a file under deploy/ibkr-gateway/) and passes the result as the VM's
# customData. No credential is ever placed here: fetch-secrets.sh reads
# ibkr-username, ibkr-password and database-live-url from Key Vault at service
# start, with the VM's user-assigned identity, into tmpfs only.
#
# Boot order: write_files (below) -> packages (Docker from Ubuntu's archive,
# which starts docker.service; its drop-in first runs ibkr-imds-guard.service)
# -> runcmd (enable the units and timers, start ibkr-live.service).

timezone: Asia/Hong_Kong
ssh_pwauth: false

# Docker Engine and the Compose plugin from Ubuntu's own archive (universe):
# no third-party apt repository or signing key, and Azure Update Manager
# patches them with the rest of the OS in the Monday window.
package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - iptables
  - curl
  - ca-certificates
  - python3

write_files:
  - path: /etc/ibkr-live/ibkr-live.env
    owner: root:root
    permissions: '0644'
    content: |
      # Non-secret settings for ibkr-live.service, fetch-secrets.sh and
      # docker-compose.yml, from infra/staging-ibkr-gateway.bicep.
      # Never put a credential here: secrets come from Key Vault into tmpfs.
      KEY_VAULT_URI=__KEY_VAULT_URI__
      IDENTITY_CLIENT_ID=__IDENTITY_CLIENT_ID__
      REGISTRY_LOGIN_SERVER=__REGISTRY_LOGIN_SERVER__
      GATEWAY_IMAGE=__GATEWAY_IMAGE__
      COLLECTOR_IMAGE=__COLLECTOR_IMAGE__
      TRADING_MODE=__TRADING_MODE__
      IB_GATEWAY_PORT=__IB_GATEWAY_PORT__
      LIVE_ACCOUNT_IDS=__LIVE_ACCOUNT_IDS__
      PORTFOLIO_TENANT_ID=__PORTFOLIO_TENANT_ID__
      LIVE_MARKET_DATA_TYPE=__LIVE_MARKET_DATA_TYPE__

  - path: /opt/ibkr-live/imds-guard.sh
    owner: root:root
    permissions: '0750'
    content: |
      #!/usr/bin/env bash
      # Containers must never reach the instance metadata endpoint
      # (169.254.169.254): it hands out tokens for the VM identity, which can
      # read the IBKR login secrets. Drop that traffic from every Docker bridge
      # (docker0 and the br-* bridges Compose creates) in DOCKER-USER, the chain
      # Docker evaluates before its own forwarding rules and never flushes.
      # Also drop the Azure host agent ports on 168.63.129.16 (the containers
      # need only DNS there, port 53, which stays open).
      # Runs before Docker starts (ibkr-imds-guard.service) and again before
      # docker compose up (ibkr-live.service). Idempotent.
      set -euo pipefail
      iptables -w -n -L DOCKER-USER >/dev/null 2>&1 || iptables -w -N DOCKER-USER
      for bridge in 'docker+' 'br-+'; do
        rule=(DOCKER-USER -i "$bridge" -d 169.254.169.254/32 -j DROP)
        iptables -w -C "${rule[@]}" 2>/dev/null || iptables -w -I "${rule[@]}"
        rule=(DOCKER-USER -i "$bridge" -d 168.63.129.16/32 -p tcp -m multiport --dports '80,32526' -j DROP)
        iptables -w -C "${rule[@]}" 2>/dev/null || iptables -w -I "${rule[@]}"
      done

  # All OS patching, and the Docker restarts or reboots it can cause, happens in
  # the Azure Update Manager window (Mondays 20:30 Hong Kong time), not whenever
  # unattended-upgrades runs: an unplanned Docker restart is a gateway login and
  # an IB Key push at a random hour.
  - path: /etc/apt/apt.conf.d/99ibkr-no-unattended-upgrades
    owner: root:root
    permissions: '0644'
    content: |
      APT::Periodic::Unattended-Upgrade "0";

  - path: /opt/ibkr-live/docker-compose.yml
    owner: root:root
    permissions: '0644'
    encoding: b64
    content: __DOCKER_COMPOSE_B64__

  - path: /opt/ibkr-live/fetch-secrets.sh
    owner: root:root
    permissions: '0750'
    encoding: b64
    content: __FETCH_SECRETS_B64__

  - path: /opt/ibkr-live/relogin-check.sh
    owner: root:root
    permissions: '0750'
    encoding: b64
    content: __RELOGIN_CHECK_B64__

  - path: /etc/systemd/system/ibkr-imds-guard.service
    owner: root:root
    permissions: '0644'
    encoding: b64
    content: __IMDS_GUARD_SERVICE_B64__

  - path: /etc/systemd/system/docker.service.d/10-ibkr-imds-guard.conf
    owner: root:root
    permissions: '0644'
    encoding: b64
    content: __DOCKER_IMDS_GUARD_CONF_B64__

  - path: /etc/systemd/system/ibkr-live.service
    owner: root:root
    permissions: '0644'
    encoding: b64
    content: __IBKR_LIVE_SERVICE_B64__

  - path: /etc/systemd/system/ibkr-gateway-weekly-relogin.service
    owner: root:root
    permissions: '0644'
    encoding: b64
    content: __WEEKLY_RELOGIN_SERVICE_B64__

  - path: /etc/systemd/system/ibkr-gateway-weekly-relogin.timer
    owner: root:root
    permissions: '0644'
    encoding: b64
    content: __WEEKLY_RELOGIN_TIMER_B64__

  - path: /etc/systemd/system/ibkr-gateway-relogin-check.service
    owner: root:root
    permissions: '0644'
    encoding: b64
    content: __RELOGIN_CHECK_SERVICE_B64__

  - path: /etc/systemd/system/ibkr-gateway-relogin-check.timer
    owner: root:root
    permissions: '0644'
    encoding: b64
    content: __RELOGIN_CHECK_TIMER_B64__

runcmd:
  - [systemctl, daemon-reload]
  - [systemctl, enable, ibkr-live.service, ibkr-gateway-weekly-relogin.timer, ibkr-gateway-relogin-check.timer]
  - [systemctl, start, ibkr-gateway-weekly-relogin.timer, ibkr-gateway-relogin-check.timer]
  # Not waited for: it retries until the new role assignments reach Key Vault
  # and the registry.
  - [systemctl, start, --no-block, ibkr-live.service]
