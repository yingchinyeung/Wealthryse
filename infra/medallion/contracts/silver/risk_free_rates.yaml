apiVersion: v3.0.2
kind: DataContract
id: wealthryse.silver.risk_free_rates
name: risk_free_rates
version: 1.0.0
status: active
domain: silver
dataProduct: portfolio-medallion
description:
  purpose: 'Daily risk-free rates: the US Treasury 3-month par yield (UST-PAR-3M, USD) and 1-month HIBOR (HKAB-HIBOR-1M,
    HKD). Risk analytics use them for excess returns and ratios.'
tags:
- silver
- market-data
schema:
- name: risk_free_rates
  physicalName: silver.risk_free_rates
  physicalType: table
  logicalType: object
  dataGranularityDescription: One row per tenant_id, rate_date and series_id.
  properties:
  - name: tenant_id
    physicalType: uuid
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 1
    classification: internal
    description: Tenant that owns the row; row-level security filters on it.
  - name: rate_date
    physicalType: text
    logicalType: date
    logicalTypeOptions:
      format: yyyy-MM-dd
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 2
    classification: internal
    description: Date of the published rate.
    quality:
    - name: rate_date_is_iso_date
      description: rate_date is an ISO date (yyyy-MM-dd) when present.
      type: sql
      query: SELECT COUNT(*) FROM silver.risk_free_rates WHERE rate_date IS NOT NULL AND rate_date !~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      mustBe: 0
      severity: error
      dimension: conformity
  - name: series_id
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 3
    classification: internal
    description: UST-PAR-3M or HKAB-HIBOR-1M.
  - name: currency
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: USD for the Treasury series, HKD for HIBOR.
  - name: tenor
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: 3-month or 1-month.
  - name: annual_rate
    physicalType: double precision
    logicalType: number
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: Annual rate as a decimal fraction (0.045 is 4.5%), converted from the published percent.
    quality:
    - name: annual_rate_in_range
      description: annual_rate is between -0.05 and 0.30; both writers reject values outside it.
      type: sql
      query: SELECT COUNT(*) FROM silver.risk_free_rates WHERE annual_rate < -0.05 OR annual_rate > 0.30
      mustBe: 0
      severity: error
      dimension: conformity
  - name: day_count_convention
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: annualized-par-yield or annualized-money-market-fixing.
  - name: provider
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: Publisher of the rate.
  - name: fetched_at
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: UTC time (ISO 8601) the row was last written. Every run re-stamps it; the USD freshness check measures
      it.
    quality:
    - name: fetched_at_is_iso_timestamp
      description: fetched_at is an ISO 8601 timestamp. layer_freshness parses it.
      type: sql
      query: SELECT COUNT(*) FROM silver.risk_free_rates WHERE fetched_at IS NOT NULL AND fetched_at !~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}'
      mustBe: 0
      severity: error
      dimension: conformity
  - name: quality_status
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: pending, pass, warn or fail. Both writers store pass.
    quality:
    - name: quality_status_allowed_values
      description: quality_status is one of pending, pass, warn, fail (a CHECK constraint).
      type: sql
      query: SELECT COUNT(*) FROM silver.risk_free_rates WHERE quality_status NOT IN ('pending', 'pass', 'warn',
        'fail')
      mustBe: 0
      severity: error
      dimension: conformity
  quality:
  - name: series_currency_match
    description: UST-PAR-3M is in USD and HKAB-HIBOR-1M in HKD.
    type: sql
    query: SELECT COUNT(*) FROM silver.risk_free_rates WHERE (series_id = 'UST-PAR-3M' AND currency <> 'USD') OR
      (series_id = 'HKAB-HIBOR-1M' AND currency <> 'HKD')
    mustBe: 0
    severity: warning
    dimension: consistency
slaDefaultElement: risk_free_rates.fetched_at
slaProperties:
- property: frequency
  value: 1
  unit: d
  element: risk_free_rates.fetched_at
- property: timeOfAvailability
  value: 23:30+00:00
  element: risk_free_rates.fetched_at
  driver: operational
- property: latency
  value: 6
  unit: h
  element: risk_free_rates.fetched_at
  driver: operational
team:
- username: portfolio-platform
  role: owner
customProperties:
- property: source
  value: market-data
- property: catalogNote
  value: 'Parsed US Treasury and HIBOR series. Raw responses: bronze-market-data.'
- property: consumers
  value:
  - ibkr_etl.agent_tools
  - ibkr_etl.hibor
  - ibkr_etl.layer_freshness
  - ibkr_etl.reference_data_source
  - ibkr_etl.risk_snapshots
- property: producers
  value:
  - ibkr_etl.hibor
  - ibkr_etl.risk_free
- property: freshnessCheck
  value:
    checkId: silver.risk_free_rates
    measure: loaded_at
    required: true
    query: SELECT MAX(fetched_at) AS observed FROM risk_free_rates WHERE currency = 'USD' AND quality_status <>
      'fail'
    source: ibkr_etl.layer_freshness.RULES
contractCreatedTs: '2026-10-18T00:00:00Z'
