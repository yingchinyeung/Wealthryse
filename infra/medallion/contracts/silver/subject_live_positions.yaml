  quality:
  - name: grain_is_unique
    description: No two rows share (tenant_id, subject_id, conid).
    type: sql
    query: SELECT COUNT(*) FROM (SELECT tenant_id, subject_id, conid FROM silver.subject_live_positions GROUP BY
      tenant_id, subject_id, conid HAVING COUNT(*) > 1) d
    mustBe: 0
    severity: warning
    dimension: uniqueness
