apiVersion: v3.0.2
kind: DataContract
id: wealthryse.silver.subject_live_summary
name: subject_live_summary
version: 1.0.0
status: active
domain: silver
dataProduct: portfolio-medallion
description:
  purpose: 'The latest live account values of each IBKR account from the read-only live collector (bronze.live_account_values):
    net liquidation, cash and P&L.'
  limitations: 'A security_invoker view: each reader sees only its own tenant''s rows through the tables'' row-level
    security. Reads bronze directly. Intraday and unreconciled; the statements in nav_snapshots stay the record.'
tags:
- silver
- derived
schema:
- name: subject_live_summary
  physicalName: silver.subject_live_summary
  physicalType: view
  logicalType: object
  dataGranularityDescription: One row per tenant_id and subject_id.
  properties:
  - name: tenant_id
    physicalType: uuid
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: Tenant that owns the row; row-level security filters on it.
  - name: subject_id
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: restricted
    description: IBKR account number. Restricted.
  - name: observed_at
    physicalType: timestamp with time zone
    logicalType: date
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: When the collector observed the values.
  - name: base_currency
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Account base currency.
  - name: net_liquidation
    physicalType: numeric
    logicalType: number
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Net liquidation value in the base currency.
  - name: total_cash
    physicalType: numeric
    logicalType: number
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Total cash in the base currency.
  - name: daily_pnl
    physicalType: numeric
    logicalType: number
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: P&L for the day.
  - name: unrealized_pnl
    physicalType: numeric
    logicalType: number
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Unrealised P&L.
  - name: realized_pnl
    physicalType: numeric
    logicalType: number
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Realised P&L.
  - name: cash_by_currency
    physicalType: jsonb
    logicalType: object
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Cash per currency as JSON.
  quality:
  - name: grain_is_unique
    description: No two rows share (tenant_id, subject_id).
    type: sql
    query: SELECT COUNT(*) FROM (SELECT tenant_id, subject_id FROM silver.subject_live_summary GROUP BY tenant_id,
      subject_id HAVING COUNT(*) > 1) d
    mustBe: 0
    severity: warning
    dimension: uniqueness
team:
- username: portfolio-platform
  role: owner
customProperties:
- property: source
  value: derived
- property: catalogNote
  value: Latest live snapshot per subject.
- property: readByViews
  value:
  - silver.subject_live_positions
- property: consumers
  value:
  - ibkr_etl.live_view
contractCreatedTs: '2026-10-18T00:00:00Z'
