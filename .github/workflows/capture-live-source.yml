name: Capture live website source

# Manual, read-only on Azure: copies named src/ibkr_etl files out of the image
# the website runs today and pushes them to a new branch under
# deploy/live-snapshot/ so they can be compared and merged with the repo.
on:
  workflow_dispatch:
    inputs:
      files:
        description: Space-separated file names in src/ibkr_etl
        required: true
        default: web.py monthly_reporting_analytics.py agent_tools.py monthly_artifacts.py

permissions:
  contents: write
  id-token: write

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AZURE_CLIENT_ID: 17708c85-b855-4209-81dd-a613a91315d3
      AZURE_TENANT_ID: 0578a50b-a7a1-40a4-905b-8b20dba84124
      AZURE_SUBSCRIPTION_ID: 3956e821-cee4-403f-8708-e84e2ed490eb
      FILES: ${{ inputs.files }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Copy the files out of the live image
        run: python deploy/website_release.py capture $FILES
      - name: Push them to a branch
        run: |
          branch="live-snapshot-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add deploy/live-snapshot
          git commit -m "Snapshot of live website source: $FILES"
          git push origin "$branch"
          echo "Pushed $branch"
