name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps .
      # Fails only on failures not listed in tests/known_failures.txt.
      - name: Test
        run: python scripts/ci_run_tests.py

  ingestion-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      # The web and report image (Dockerfile) needs private templates that
      # are kept out of git, so CI builds the ingestion image only and
      # pushes nothing.
      - name: Build
        run: docker build -f Dockerfile.azure -t wealthryse-ingestion:ci .

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build every Bicep file
        run: |
          az bicep install
          for file in infra/*.bicep; do
            echo "::group::$file"
            az bicep build --file "$file" --stdout > /dev/null
            echo "::endgroup::"
          done
