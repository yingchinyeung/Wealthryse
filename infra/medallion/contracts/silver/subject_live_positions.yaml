apiVersion: v3.0.2
kind: DataContract
id: wealthryse.silver.subject_live_positions
name: subject_live_positions
version: 1.0.0
status: active
domain: silver
dataProduct: portfolio-medallion
description:
  purpose: Positions in each IBKR account's latest live snapshot, with contract details and the latest live quote.
  limitations: 'A security_invoker view: each reader sees only its own tenant''s rows through the tables'' row-level
    security. Reads bronze directly (live_positions, live_contracts, live_quotes). Intraday and unreconciled.'
tags:
- silver
- derived
schema:
- name: subject_live_positions
  physicalName: silver.subject_live_positions
  physicalType: view
  logicalType: object
  dataGranularityDescription: One row per tenant_id, subject_id and conid.
  properties:
  - name: tenant_id
    physicalType: uuid
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: Tenant that owns the row; row-level security filters on it.
  - name: subject_id
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: restricted
    description: IBKR account number. Restricted.
  - name: observed_at
    physicalType: timestamp with time zone
    logicalType: date
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: When the collector observed the positions (the account's latest snapshot).
  - name: conid
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: IBKR contract id.
  - name: symbol
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Ticker symbol.
  - name: description
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
