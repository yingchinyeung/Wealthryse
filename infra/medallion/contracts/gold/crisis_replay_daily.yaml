apiVersion: v3.0.2
kind: DataContract
id: wealthryse.gold.crisis_replay_daily
name: crisis_replay_daily
version: 1.0.0
status: active
domain: gold
dataProduct: portfolio-medallion
description:
  purpose: 'Daily path of the Lehman crisis replay (15 Sep 2008 to 9 Mar 2009) for each subject''s holdings on a
    date: the holdings'' weights on that date replayed through the crisis, with the drawdown from the running peak.'
  limitations: calculation_version is not part of the key, so a new version replaces the rows of the same holdings
    date. Provisional Yahoo prices; every row is quality_status warn.
tags:
- gold
- derived
schema:
- name: crisis_replay_daily
  physicalName: gold.crisis_replay_daily
  physicalType: table
  logicalType: object
  dataGranularityDescription: One row per tenant_id, subject_id, holdings_as_of and observation_date.
  properties:
  - name: tenant_id
    physicalType: uuid
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 1
    classification: internal
    description: Tenant that owns the row; row-level security filters on it.
  - name: subject_id
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 2
    classification: restricted
    description: 'Subject: an IBKR account number for accounts, a slug for portfolios and composites. Restricted.'
  - name: holdings_as_of
    physicalType: text
    logicalType: date
    logicalTypeOptions:
      format: yyyy-MM-dd
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 3
    classification: confidential-financial
    description: Date of the holdings replayed.
    quality:
    - name: holdings_as_of_is_iso_date
      description: holdings_as_of is an ISO date (yyyy-MM-dd) when present.
      type: sql
      query: SELECT COUNT(*) FROM gold.crisis_replay_daily WHERE holdings_as_of IS NOT NULL AND holdings_as_of !~
        '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      mustBe: 0
      severity: error
      dimension: conformity
  - name: observation_date
    physicalType: text
    logicalType: date
    logicalTypeOptions:
      format: yyyy-MM-dd
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 4
    classification: confidential-financial
    description: Day in the crisis window.
    quality:
    - name: observation_date_is_iso_date
      description: observation_date is an ISO date (yyyy-MM-dd) when present.
      type: sql
      query: SELECT COUNT(*) FROM gold.crisis_replay_daily WHERE observation_date IS NOT NULL AND observation_date
        !~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      mustBe: 0
      severity: error
      dimension: conformity
  - name: normalized_value
    physicalType: double precision
    logicalType: number
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: 'Replayed value as a multiple of the holdings'' NAV: 1 on crisis_start.'
    quality:
    - name: normalized_value_positive
      description: normalized_value is above zero (a CHECK constraint).
      type: sql
      query: SELECT COUNT(*) FROM gold.crisis_replay_daily WHERE normalized_value <= 0
      mustBe: 0
      severity: error
      dimension: conformity
  - name: drawdown
    physicalType: double precision
    logicalType: number
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: normalized_value / running peak − 1; zero or below.
    quality:
    - name: drawdown_not_positive
      description: drawdown is zero or below (a CHECK constraint).
      type: sql
      query: SELECT COUNT(*) FROM gold.crisis_replay_daily WHERE drawdown > 0
      mustBe: 0
      severity: error
      dimension: conformity
  - name: crisis_start
    physicalType: text
    logicalType: date
    logicalTypeOptions:
      format: yyyy-MM-dd
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: First day of the crisis window.
    quality:
    - name: crisis_start_is_iso_date
      description: crisis_start is an ISO date (yyyy-MM-dd) when present.
      type: sql
      query: SELECT COUNT(*) FROM gold.crisis_replay_daily WHERE crisis_start IS NOT NULL AND crisis_start !~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      mustBe: 0
      severity: error
      dimension: conformity
  - name: crisis_end
    physicalType: text
    logicalType: date
    logicalTypeOptions:
      format: yyyy-MM-dd
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Last day of the crisis window.
    quality:
    - name: crisis_end_is_iso_date
      description: crisis_end is an ISO date (yyyy-MM-dd) when present.
      type: sql
      query: SELECT COUNT(*) FROM gold.crisis_replay_daily WHERE crisis_end IS NOT NULL AND crisis_end !~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      mustBe: 0
      severity: error
      dimension: conformity
  - name: calculation_version
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: Replay method version.
  - name: quality_status
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: pass, warn or fail; the current writers store warn.
    quality:
    - name: quality_status_allowed_values
      description: quality_status is one of pass, warn, fail (a CHECK constraint).
      type: sql
      query: SELECT COUNT(*) FROM gold.crisis_replay_daily WHERE quality_status NOT IN ('pass', 'warn', 'fail')
      mustBe: 0
      severity: error
      dimension: conformity
  - name: generated_at
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: UTC time (ISO 8601) of the run that wrote the row.
  quality:
  - name: inside_crisis_window
    description: observation_date is inside the crisis window.
    type: sql
    query: SELECT COUNT(*) FROM gold.crisis_replay_daily WHERE observation_date < crisis_start OR observation_date
      > crisis_end
    mustBe: 0
    severity: error
    dimension: conformity
  - name: starts_at_one
    description: normalized_value is 1 on crisis_start.
    type: sql
    query: SELECT COUNT(*) FROM gold.crisis_replay_daily WHERE observation_date = crisis_start AND ABS(normalized_value
      - 1) > 1e-9
    mustBe: 0
    severity: error
    dimension: accuracy
  - name: covers_both_ends
    description: Each replay has rows for crisis_start and crisis_end.
    type: sql
    query: SELECT COUNT(*) FROM (SELECT tenant_id, subject_id, holdings_as_of FROM gold.crisis_replay_daily GROUP
      BY 1, 2, 3 HAVING COUNT(*) FILTER (WHERE observation_date = crisis_start) = 0 OR COUNT(*) FILTER (WHERE observation_date
      = crisis_end) = 0) d
    mustBe: 0
    severity: warning
    dimension: completeness
slaDefaultElement: crisis_replay_daily.holdings_as_of
slaProperties:
- property: frequency
  value: 1
  unit: d
  element: crisis_replay_daily.holdings_as_of
- property: timeOfAvailability
  value: 09:30+00:00
  element: crisis_replay_daily.holdings_as_of
  driver: operational
- property: latency
  value: 4
  unit: d
  element: crisis_replay_daily.holdings_as_of
  driver: operational
team:
- username: portfolio-platform
  role: owner
customProperties:
- property: source
  value: derived
- property: catalogNote
  value: Historical crisis replay.
- property: consumers
  value:
  - ibkr_etl.crisis_replay
  - ibkr_etl.layer_freshness
- property: producers
  value:
  - ibkr_etl.crisis_replay
- property: freshnessCheck
  value:
    checkId: gold.crisis_replay_daily
    measure: as_of_date
    required: true
    query: SELECT MAX(holdings_as_of) AS observed FROM crisis_replay_daily
    source: ibkr_etl.layer_freshness.RULES
- property: calculationVersionColumn
  value: calculation_version
- property: calculationVersionSource
  value:
  - ibkr_etl.crisis_replay.CALCULATION_VERSION
contractCreatedTs: '2026-10-18T00:00:00Z'
