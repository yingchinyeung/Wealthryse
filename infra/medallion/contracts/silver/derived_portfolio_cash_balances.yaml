apiVersion: v3.0.2
kind: DataContract
id: wealthryse.silver.derived_portfolio_cash_balances
name: derived_portfolio_cash_balances
version: 1.0.0
status: active
domain: silver
dataProduct: portfolio-medallion
description:
  purpose: Daily cash balance of each derived portfolio in each allowed cash currency, built from the included ledger
    events, and its value in the base currency.
  limitations: Rebuilt in full for a portfolio on each refresh.
tags:
- silver
- derived
schema:
- name: derived_portfolio_cash_balances
  physicalName: silver.derived_portfolio_cash_balances
  physicalType: table
  logicalType: object
  dataGranularityDescription: One row per tenant_id, portfolio_id, snapshot_date and currency.
  properties:
  - name: tenant_id
    physicalType: uuid
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 1
    classification: internal
    description: Tenant that owns the row; row-level security filters on it.
  - name: portfolio_id
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 2
    classification: confidential-financial
    description: Derived portfolio id (derived_portfolios.portfolio_id).
  - name: snapshot_date
    physicalType: text
    logicalType: date
    logicalTypeOptions:
      format: yyyy-MM-dd
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 3
    classification: confidential-financial
    description: NAV date of the source account.
    quality:
    - name: snapshot_date_is_iso_date
      description: snapshot_date is an ISO date (yyyy-MM-dd) when present.
      type: sql
      query: SELECT COUNT(*) FROM silver.derived_portfolio_cash_balances WHERE snapshot_date IS NOT NULL AND snapshot_date
        !~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      mustBe: 0
      severity: error
      dimension: conformity
  - name: currency
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 4
    classification: confidential-financial
    description: An allowed cash currency of the portfolio (HKD and USD unless its contract says otherwise).
  - name: opening_balance
    physicalType: double precision
    logicalType: number
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: 'Balance before this date''s activity: the previous date''s closing balance, or the approved opening
      balance.'
  - name: activity
    physicalType: double precision
    logicalType: number
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Included ledger amounts dated after the previous snapshot date, up to and including this one.
  - name: closing_balance
    physicalType: double precision
    logicalType: number
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: opening_balance + activity.
  - name: fx_rate_to_base
    physicalType: double precision
    logicalType: number
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Rate to the base currency on snapshot_date.
  - name: base_value
    physicalType: double precision
    logicalType: number
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: closing_balance × fx_rate_to_base.
  - name: generated_at
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: UTC time (ISO 8601) of the run that wrote the row.
  quality:
  - name: closing_is_opening_plus_activity
    description: closing_balance equals opening_balance + activity.
    type: sql
    query: SELECT COUNT(*) FROM silver.derived_portfolio_cash_balances WHERE ABS(closing_balance - opening_balance
      - activity) > 1e-9 * GREATEST(1, ABS(closing_balance))
    mustBe: 0
    severity: error
    dimension: accuracy
  - name: base_value_matches
    description: base_value equals closing_balance × fx_rate_to_base.
    type: sql
    query: SELECT COUNT(*) FROM silver.derived_portfolio_cash_balances WHERE ABS(base_value - closing_balance *
      fx_rate_to_base) > 1e-9 * GREATEST(1, ABS(base_value))
    mustBe: 0
    severity: error
    dimension: accuracy
  - name: opening_is_previous_closing
    description: Each day's opening balance is the previous day's closing balance in the same currency.
    type: sql
    query: SELECT COUNT(*) FROM (SELECT opening_balance, LAG(closing_balance) OVER (PARTITION BY tenant_id, portfolio_id,
      currency ORDER BY snapshot_date) AS previous FROM silver.derived_portfolio_cash_balances) b WHERE previous
      IS NOT NULL AND ABS(opening_balance - previous) > 1e-9 * GREATEST(1, ABS(previous))
    mustBe: 0
    severity: error
    dimension: consistency
team:
- username: portfolio-platform
  role: owner
customProperties:
- property: source
  value: derived
- property: catalogNote
  value: Filtered and composite subjects, conformed to the same shape as account data.
- property: readByViews
  value:
  - silver.subject_cash_balance_series
- property: consumers
  value:
  - ibkr_etl.analyst_export
  - ibkr_etl.report
- property: producers
  value:
  - ibkr_etl.derived_portfolio
contractCreatedTs: '2026-10-18T00:00:00Z'
