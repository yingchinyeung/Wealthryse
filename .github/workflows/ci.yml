name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps .
      # Fails only on failures not listed in tests/known_failures.txt.
      - name: Test
        run: python scripts/ci_run_tests.py

  # Agent schema, account isolation and tool figures against a real
  # PostgreSQL (synthetic data only). The main test job skips these.
  agent-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps .
      - name: Test
        env:
          AGENT_TEST_PG_ADMIN_DSN: "host=localhost port=5432 user=postgres password=ci-only dbname=postgres"
        run: python -m unittest discover -s tests -p "test_wealthryse_agent_db.py" -v

  ingestion-image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      # The web and report image (Dockerfile) needs private templates that
      # are kept out of git, so CI builds the ingestion image only and
      # pushes nothing.
      - name: Build
        run: docker build -f Dockerfile.azure -t wealthryse-ingestion:ci .

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build every Bicep file
        run: |
          az bicep install
          for file in infra/*.bicep; do
            echo "::group::$file"
            az bicep build --file "$file" --stdout > /dev/null
            echo "::endgroup::"
          done
