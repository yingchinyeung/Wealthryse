apiVersion: v3.0.2
kind: DataContract
id: wealthryse.silver.v_daily_nav
name: v_daily_nav
version: 1.0.0
status: active
domain: silver
dataProduct: portfolio-medallion
description:
  purpose: 'Account NAV totals cast to numbers: the TOTAL, ALL or blank asset-class rows of nav_snapshots.'
  limitations: 'A security_invoker view: each reader sees only its own tenant''s rows through the tables'' row-level
    security. Fails on read if any of the text values is not a number (see the nav_snapshots rules). Has no tenant_id
    column.'
tags:
- silver
- derived
schema:
- name: v_daily_nav
  physicalName: silver.v_daily_nav
  physicalType: view
  logicalType: object
  dataGranularityDescription: One row per account_id, snapshot_date and currency.
  properties:
  - name: account_id
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: restricted
    description: 'IBKR account number. Restricted: never shown or logged in full.'
  - name: snapshot_date
    physicalType: text
    logicalType: date
    logicalTypeOptions:
      format: yyyy-MM-dd
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Statement date.
    quality:
    - name: snapshot_date_is_iso_date
      description: snapshot_date is an ISO date (yyyy-MM-dd) when present.
      type: sql
      query: SELECT COUNT(*) FROM silver.v_daily_nav WHERE snapshot_date IS NOT NULL AND snapshot_date !~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      mustBe: 0
      severity: error
      dimension: conformity
  - name: currency
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Currency of the figures.
  - name: total_nav
    physicalType: double precision
    logicalType: number
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Total NAV.
  - name: cash
    physicalType: double precision
    logicalType: number
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Cash.
  - name: stock
    physicalType: double precision
    logicalType: number
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Stocks.
  - name: options
    physicalType: double precision
    logicalType: number
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Options.
  - name: futures
    physicalType: double precision
    logicalType: number
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Futures.
  - name: bonds
    physicalType: double precision
    logicalType: number
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Bonds.
  - name: accruals
    physicalType: double precision
    logicalType: number
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Accruals.
  quality:
  - name: grain_is_unique
    description: No two rows share (account_id, snapshot_date, currency). An account with both TOTAL and ALL rows
      on one date would break it.
    type: sql
    query: SELECT COUNT(*) FROM (SELECT account_id, snapshot_date, currency FROM silver.v_daily_nav GROUP BY account_id,
      snapshot_date, currency HAVING COUNT(*) > 1) d
    mustBe: 0
    severity: warning
    dimension: uniqueness
team:
- username: portfolio-platform
  role: owner
customProperties:
- property: source
  value: derived
- property: catalogNote
  value: NAV TOTAL cast to numbers.
- property: consumers
  value:
  - ibkr_etl.analyst_export
  - ibkr_etl.derived_portfolio
  - ibkr_etl.report
  - ibkr_etl.service
contractCreatedTs: '2026-10-18T00:00:00Z'
