apiVersion: v3.0.2
kind: DataContract
id: wealthryse.gold.crisis_replay_components
name: crisis_replay_components
version: 1.0.0
status: active
domain: gold
dataProduct: portfolio-medallion
description:
  purpose: 'The holdings in each crisis replay: each holding''s weight in the subject''s NAV on the holdings date
    and the price series that stands in for it (its own, or a market proxy ETF).'
  limitations: 'No calculation-version column: the rows are replaced together with the daily path of the same holdings
    date.'
tags:
- gold
- derived
schema:
- name: crisis_replay_components
  physicalName: gold.crisis_replay_components
  physicalType: table
  logicalType: object
  dataGranularityDescription: One row per tenant_id, subject_id, holdings_as_of and conid.
  properties:
  - name: tenant_id
    physicalType: uuid
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 1
    classification: internal
    description: Tenant that owns the row; row-level security filters on it.
  - name: subject_id
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 2
    classification: restricted
    description: 'Subject: an IBKR account number for accounts, a slug for portfolios and composites. Restricted.'
  - name: holdings_as_of
    physicalType: text
    logicalType: date
    logicalTypeOptions:
      format: yyyy-MM-dd
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 3
    classification: confidential-financial
    description: Date of the holdings replayed.
    quality:
    - name: holdings_as_of_is_iso_date
      description: holdings_as_of is an ISO date (yyyy-MM-dd) when present.
      type: sql
      query: SELECT COUNT(*) FROM gold.crisis_replay_components WHERE holdings_as_of IS NOT NULL AND holdings_as_of
        !~ '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
      mustBe: 0
      severity: error
      dimension: conformity
  - name: conid
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: true
    primaryKeyPosition: 4
    classification: confidential-financial
    description: IBKR contract id of the holding.
  - name: holding_symbol
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Symbol of the holding.
  - name: description
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Description of the holding.
  - name: currency
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Currency of the holding.
  - name: current_market_value
    physicalType: double precision
    logicalType: number
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: Market value of the holding on holdings_as_of.
  - name: opening_weight
    physicalType: double precision
    logicalType: number
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: current_market_value / the subject's NAV on holdings_as_of.
  - name: source_symbol
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: confidential-financial
    description: 'Ticker whose prices replay the holding: its own or a proxy ETF.'
  - name: mapping_method
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: direct (its own prices) or market_proxy.
    quality:
    - name: mapping_method_allowed_values
      description: mapping_method is one of direct, market_proxy (a CHECK constraint).
      type: sql
      query: SELECT COUNT(*) FROM gold.crisis_replay_components WHERE mapping_method NOT IN ('direct', 'market_proxy')
      mustBe: 0
      severity: error
      dimension: conformity
  - name: proxy_reason
    physicalType: text
    logicalType: string
    required: false
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: Why a proxy stands in; empty for direct.
  - name: price_type
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: Price series used (adjusted_close).
  - name: provider
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: Price provider.
  - name: fetched_at
    physicalType: text
    logicalType: string
    required: true
    unique: false
    primaryKey: false
    primaryKeyPosition: -1
    classification: internal
    description: UTC time (ISO 8601) the replay was written.
  quality:
  - name: has_daily_path
    description: Every replay's holdings have a daily path in gold.crisis_replay_daily.
    type: sql
    query: SELECT COUNT(*) FROM (SELECT DISTINCT tenant_id, subject_id, holdings_as_of FROM gold.crisis_replay_components)
      c WHERE NOT EXISTS (SELECT 1 FROM gold.crisis_replay_daily d WHERE d.tenant_id = c.tenant_id AND d.subject_id
      = c.subject_id AND d.holdings_as_of = c.holdings_as_of)
    mustBe: 0
    severity: warning
    dimension: consistency
  - name: direct_has_no_proxy_reason
    description: A direct holding has no proxy reason.
    type: sql
    query: SELECT COUNT(*) FROM gold.crisis_replay_components WHERE mapping_method = 'direct' AND proxy_reason IS
      NOT NULL
    mustBe: 0
    severity: warning
    dimension: consistency
team:
- username: portfolio-platform
  role: owner
customProperties:
- property: source
  value: derived
- property: catalogNote
  value: Historical crisis replay.
- property: consumers
  value:
  - ibkr_etl.alpha_world_t_crisis
  - ibkr_etl.crisis_replay
- property: producers
  value:
  - ibkr_etl.crisis_replay
contractCreatedTs: '2026-10-18T00:00:00Z'
