name: Inventory deployed images

# Manual, read-only on Azure: hashes every .py file under /app/src/ibkr_etl and
# /app/scripts in each named image on the private build VM, compares them with
# this commit, and pushes deploy/image-inventory/<digest>.json to a new branch.
# Nothing is built, pushed to the registry or changed in Azure.
on:
  workflow_dispatch:
    inputs:
      images:
        description: Space-separated images by digest (<registry>/ibkr-platform@sha256:<digest>)
        required: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  inventory:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AZURE_CLIENT_ID: 17708c85-b855-4209-81dd-a613a91315d3
      AZURE_TENANT_ID: 0578a50b-a7a1-40a4-905b-8b20dba84124
      AZURE_SUBSCRIPTION_ID: 3956e821-cee4-403f-8708-e84e2ed490eb
      IMAGES: ${{ inputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Hash and compare the images
        run: python deploy/website_release.py inventory $IMAGES
      - name: Push the inventory to a branch
        run: |
          branch="image-inventory-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add deploy/image-inventory
          git commit -m "Inventory of deployed images"
          git push origin "$branch"
          echo "Pushed $branch"
